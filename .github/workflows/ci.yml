name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Validate skills
        id: validate
        run: |
          set +e
          uv run scripts/besci_validate.py | tee validate-report.txt
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Check bundled validator copies are in sync
        run: uv run scripts/check_sync.py

      - name: Build site
        run: uv run scripts/build_site.py

      - name: Package skills
        run: uv run scripts/package_skills.py

      - name: Post validator report on the pull request
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- besci-validate-report -->';
            let report = '';
            try { report = fs.readFileSync('validate-report.txt', 'utf8'); } catch (e) { report = '(no report produced)'; }
            const passed = '${{ steps.validate.outputs.exit }}' === '0';
            const head = passed
              ? '### Skill structure check: passed'
              : '### Skill structure check: failed — fix the items below and push again';
            const body = `${marker}\n${head}\n\n\`\`\`\n${report.trim()}\n\`\`\`\n\n_This checks structure only. A maintainer still reviews the content before merge. Rules: \`docs/skill-spec.md\`._`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail the job if validation failed
        if: steps.validate.outputs.exit != '0'
        run: |
          echo "Validator reported errors (see report above)."
          exit 1
