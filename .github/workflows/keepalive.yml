name: Keep the database awake

# Supabase pauses free-plan projects after about a week without requests, which
# would break sign-in records and ratings until someone restores the project by
# hand. /api/health makes one small database read. If the site moves to a custom
# domain, change SITE below (docs/deployment.md, section 6).

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions: {}

env:
  SITE: https://besci-skills.vercel.app

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/health
        run: |
          # 503 (database down or paused) fails the run, so maintainers get an email.
          body=$(curl -fsS --max-time 30 "$SITE/api/health")
          echo "$body"
          if echo "$body" | grep -q '"db": false'; then
            echo "::notice::The site has no database configured yet (SUPABASE_URL, SUPABASE_SECRET_KEY)."
          fi
