name: Refresh navigator catalog snapshot

# besci-navigator ships a snapshot of the catalog so it works offline and in
# Claude Desktop. Regenerate it whenever a skill or the taxonomy changes on main.

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "taxonomy.yaml"
      - "scripts/snapshot_catalog.py"
      - "scripts/besci_validate.py"

permissions:
  contents: write

concurrency:
  group: snapshot-main
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # Skip the commit the bot itself makes.
    if: "!contains(github.event.head_commit.message, 'chore: refresh navigator catalog snapshot')"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Regenerate snapshot
        run: uv run scripts/snapshot_catalog.py

      - name: Commit if changed
        run: |
          git config user.name "besci-snapshot-bot"
          git config user.email "besci-snapshot-bot@users.noreply.github.com"
          git add skills/besci-navigator/references/catalog.md
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
          else
            git commit -m "chore: refresh navigator catalog snapshot [skip ci]"
            git push
          fi
