<svg xmlns="http://www.w3.org/2000/svg" width="560" height="560" viewBox="0 0 560 560">
  <!-- Paper texture for the light theme: fine grain over soft, plaster-like mottling. Tiles seamlessly. -->
  <filter id="mottle" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.0143" numOctaves="4" seed="7" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.42  0 0 0 0 0.36  0.15 0 0 0 -0.062"/>
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.82 0.7" numOctaves="3" seed="2" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.36  0 0 0 0 0.33  0 0 0 0 0.27  0.5 0 0 0 -0.2"/>
  </filter>
  <rect width="560" height="560" filter="url(#mottle)"/>
  <rect width="560" height="560" filter="url(#grain)"/>
</svg>
